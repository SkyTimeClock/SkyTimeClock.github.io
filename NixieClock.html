<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D 輝光鐘 (Nixie Clock)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;650;750&family=JetBrains+Mono:wght@400;500;700&display=swap');

    :root {
      color-scheme: dark;
      --panel: rgba(16, 18, 22, 0.9);
      --line: rgba(255, 255, 255, 0.1);
      --ink: #f6f0e6;
      --muted: #a49e94;
      --accent: #ff7a2e;
      --focus: #38bdf8;
      --shadow: rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      background: 
        radial-gradient(circle at 50% -12%, rgba(255, 110, 40, 0.08), transparent 50rem),
        linear-gradient(180deg, #181a1f 0%, #07080a 65%, #030405 100%);
      color: var(--ink);
      font-family: "Outfit", "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 40px);
    }

    .app {
      width: min(1360px, 100%);
      display: grid;
      gap: 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff8f0;
      font-weight: 750;
      font-size: clamp(20px, 2.5vw, 28px);
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 14px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(180deg, #fffcf5, #ff8a28 45%, #e12711);
      box-shadow: 0 0 16px #ff6d26, 0 0 32px rgba(255, 93, 34, 0.7);
      flex: 0 0 auto;
    }
/* ── SETTINGS BUTTON ── */
    .settingsBtn{
      display: grid;
      place-items: center;
      width:44px;height:44px;border-radius:12px;
      background: rgba(20, 22, 28, 0.6);
      border:1px solid rgba(0,200,255,.25);
      color:rgba(224, 224, 224, 0.7);
      font-size:24px;cursor:pointer;
      align-items:center;justify-content:center;
      transition:border-color .2s,box-shadow .2s;
      box-shadow:0 0 16px rgba(0,180,255,.1);
      z-index:100;
      }
    #openSettings:hover{border-color:rgba(0,220,255,.7);box-shadow:0 0 20px rgba(0,200,255,.3);}

    .icon-button,
    .text-button {
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(20, 22, 28, 0.6);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
    }

    .text-button {
      min-height: 42px;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 650;
    }

    .icon-button:hover,
    .text-button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 122, 46, 0.5);
      background: rgba(30, 24, 20, 0.85);
      box-shadow: 0 12px 40px rgba(255, 122, 46, 0.12), 0 4px 12px var(--shadow);
    }

    .icon-button:active,
    .text-button:active {
      transform: translateY(0);
    }

    .icon-button:focus-visible,
    .text-button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .stage {
      position: relative;
      width: 100%;
      min-height: clamp(460px, 55vw, 680px);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 110, 40, 0.05), transparent 45%),
        #040507;
      box-shadow: 
        0 40px 90px rgba(0, 0, 0, 0.75), 
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      isolation: isolate;
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #threeLayer {
      z-index: 0;
    }

    #clockCanvas {
      z-index: 1;
    }

    .stage-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.45), transparent 15%, transparent 85%, rgba(0, 0, 0, 0.45)),
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
      mix-blend-mode: multiply;
    }

    dialog {
      width: min(1040px, calc(100vw - 32px));
      max-height: min(860px, calc(100vh - 40px));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 0;
      color: var(--ink);
      background: rgba(12, 14, 18, 0.96);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      margin: auto;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
    }

    .settings-head {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    .settings-title {
      font-weight: 750;
      font-size: 20px;
      letter-spacing: -0.01em;
      color: #fff8f0;
    }

    .settings-body {
      padding: 24px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
      gap: 20px;
      overflow: auto;
      max-height: calc(100vh - 130px);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.025);
      padding: 20px;
    }

    .panel h2 {
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 650;
      color: #fff3e3;
      border-left: 3px solid var(--accent);
      padding-left: 10px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .color-cell {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      align-items: center;
      text-align: center;
    }

    .color-cell span {
      width: 100%;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input[type="color"] {
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .range-list {
      display: grid;
      gap: 16px;
    }

    .range-row {
      display: grid;
      grid-template-columns: 100px 1fr 50px;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    .range-value {
      text-align: right;
      color: #fff;
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
    }

    @media (max-width: 860px) {
      body {
        padding: 16px;
      }

      .stage {
        min-height: 480px;
      }

      .settings-body {
        grid-template-columns: 1fr;
      }

      .color-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .range-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .range-value {
        text-align: left;
      }
    }

    @media (max-width: 520px) {
      .color-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>

             <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />

        <span class="brand-mark" aria-hidden="true"></span>

    </header>

    <section class="stage" aria-label="輝光數字時鐘">
      <canvas id="threeLayer" aria-hidden="true"></canvas>
      <canvas id="clockCanvas"></canvas>
      <div class="stage-vignette" aria-hidden="true"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog">
      <div class="settings-head">
        <div class="settings-title">參數設定</div>
        <button class="icon-button" type="submit" aria-label="關閉" title="關閉">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <section class="panel">
          <h2>16 色獨立設定</h2>
          <div class="color-grid" id="colorControls"></div>
        </section>
        <div class="range-list">
          <section class="panel">
            <h2>輝光細管</h2>
            <div class="range-list" id="glowControls"></div>
          </section>
          <section class="panel">
            <h2>折光桌面</h2>
            <div class="range-list" id="deskControls"></div>
          </section>
          <div class="settings-actions">
            <button class="text-button" id="resetSettings" type="button">重設</button>
            <button class="text-button" type="submit">完成</button>
          </div>
        </div>
      </div>
    </form>
  </dialog>
    
  <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.min.js"></script>
  <script src="./NixieClock.js"></script>
</body>
